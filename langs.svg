<svg xmlns="http://www.w3.org/2000/svg" width="360" height="196" viewBox="0 0 360 196"><style>@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}:root{--bg:#f6f8fa;--fg:#1f2328;--mut:#656d76;--acc:#2da44e;--line:#d0d7de}
