<svg xmlns="http://www.w3.org/2000/svg" width="580" height="150" viewBox="0 0 580 150"><style>@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}:root{--bg:#f6f8fa;--fg:#1f2328;--mut:#656d76;--acc:#2da44e;--line:#d0d7de}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--acc:#3fb950;--line:#30363d}}text{font-family:'JBM',ui-monospace,Menlo,Consolas,monospace;fill:var(--fg)}.m{fill:var(--mut)}.a{fill:var(--acc)}.b{font-weight:700}</style><rect width="580" height="150" rx="10" fill="var(--bg)" stroke="var(--line)"/><text x="20" y="30" font-size="12" class="m">contributions in the last year</text><text x="20" y="70" font-size="26" class="b a" opacity="0">1,423<animate attributeName="opacity" from="0" to="1" begin="0.00s" dur=".5s" fill="freeze"/></text><text x="20" y="86" font-size="11" class="m">contributions</text><text x="200" y="70" font-size="26" class="b a" opacity="0">1,339<animate attributeName="opacity" from="0" to="1" begin="0.12s" dur=".5s" fill="freeze"/></text><text x="200" y="86" font-size="11" class="m">commits</text><text x="380" y="70" font-size="26" class="b a" opacity="0">1<animate attributeName="opacity" from="0" to="1" begin="0.24s" dur=".5s" fill="freeze"/></text><text x="380" y="86" font-size="11" class="m">pull requests</text><text x="20" y="122" font-size="26" class="b a" opacity="0">0<animate attributeName="opacity" from="0" to="1" begin="0.36s" dur=".5s" fill="freeze"/></text><text x="20" y="138" font-size="11" class="m">issues</text><text x="200" y="122" font-size="26" class="b a" opacity="0">9<animate attributeName="opacity" from="0" to="1" begin="0.48s" dur=".5s" fill="freeze"/></text><text x="200" y="138" font-size="11" class="m">stars</text><text x="380" y="122" font-size="26" class="b a" opacity="0">92<animate attributeName="opacity" from="0" to="1" begin="0.60s" dur=".5s" fill="freeze"/></text><text x="380" y="138" font-size="11" class="m">public repos</text></svg>